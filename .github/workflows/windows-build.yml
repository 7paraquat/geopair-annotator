name: Windows portable build
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
permissions:
  contents: write
env:
  PYTHONIOENCODING: utf-8
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt
      - run: python examples/generate_demo.py
      - run: python -m unittest discover -s tests -p test_dataset_index.py
      - run: python -m unittest discover -s tests -p test_github_update.py
      - run: python build.py
      - run: python tests/test_release.py
      - run: python package_release.py
      - name: Publish versioned GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content version.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw 'Tag and version.json disagree' }
          $archive = "release/GeoPairAnnotator-v$version-windows-x64.zip"
          $notes = "docs/RELEASE_NOTES_v$version.md"
          if (!(Test-Path -LiteralPath $archive) -or !(Test-Path -LiteralPath $notes)) { throw 'Release files missing' }
          gh release create $env:GITHUB_REF_NAME $archive "$archive.sha256" --title "GeoPair Annotator v$version" --notes-file $notes --verify-tag
      - uses: actions/upload-artifact@v4
        with:
          name: GeoPairAnnotator-windows-x64
          path: release/*
