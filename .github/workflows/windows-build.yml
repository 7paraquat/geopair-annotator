name: Windows portable build
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
permissions:
  contents: write
env:
  PYTHONIOENCODING: utf-8
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt
      - run: python examples/generate_demo.py
      - run: python -m unittest discover -s tests -p test_dataset_index.py
      - run: python -m unittest discover -s tests -p test_github_update.py
      - run: node tests/check_multi_move.js
      - run: python build.py
      - run: python tests/test_release.py
      - run: python package_release.py
      - name: Publish versioned GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content version.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw 'Tag and version.json disagree' }
          $archive = "release/GeoPairAnnotator-v$version-windows-x64.zip"
          $notes = "docs/RELEASE_NOTES_v$version.md"
          if (!(Test-Path -LiteralPath $archive) -or !(Test-Path -LiteralPath $notes)) { throw 'Release files missing' }
          gh release create $env:GITHUB_REF_NAME $archive "$archive.sha256" --title "GeoPair Annotator v$version" --notes-file $notes --verify-tag
      - name: Publish Git update feed
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Get-Content version.json -Raw | ConvertFrom-Json).version
          $archive = (Resolve-Path "release/GeoPairAnnotator-v$version-windows-x64.zip").Path
          $feed = Join-Path $env:RUNNER_TEMP 'geopair-update-feed'
          git fetch origin refs/heads/update-feed
          git worktree add --detach $feed FETCH_HEAD
          $target = Join-Path $feed 'GeoPairAnnotator-windows-x64.zip'
          Copy-Item -LiteralPath $archive -Destination $target -Force
          $manifest = @{
            version = $version
            archive = 'GeoPairAnnotator-windows-x64.zip'
            size = (Get-Item -LiteralPath $target).Length
            sha256 = (Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash.ToLowerInvariant()
          } | ConvertTo-Json -Compress
          Set-Content -LiteralPath (Join-Path $feed 'latest.json') -Value $manifest -Encoding utf8 -NoNewline
          git -C $feed config user.name 'github-actions[bot]'
          git -C $feed config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C $feed add latest.json GeoPairAnnotator-windows-x64.zip
          git -C $feed commit -m "Publish v$version update feed"
          git -C $feed push origin HEAD:refs/heads/update-feed
      - uses: actions/upload-artifact@v4
        with:
          name: GeoPairAnnotator-windows-x64
          path: release/*
